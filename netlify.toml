# Configuración de despliegue en Netlify

[build]
  command = "npm run build"
  publish = "dist/productos-frontend/browser"

# Proxy: las llamadas a /api se reenvían al backend en Render.
# status 200 = "rewrite" (proxy del lado del servidor) → el navegador ve mismo origen, sin CORS.
[[redirects]]
  from = "/api/*"
  to = "https://productos-api-6275.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback para el router de Angular: cualquier ruta desconocida sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
